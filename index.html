<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; media-src https://upload.wikimedia.org https://archive.org https://*.archive.org; connect-src 'self' https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com; frame-src https://n1-quiz-moe.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff3dc">
<script src="js/theme.js"></script>
<title>N1 クイズ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="modulepreload" href="js/app.js">
</head>
<body data-tab="home">
<div class="app">
  <aside class="rail" aria-label="メニュー">
    <div class="logo"><b>N1</b>クイズ</div>
    <nav class="nav" id="nav-rail"></nav>
    <div class="rail-foot">
      <div class="bubble down" id="rail-say"></div>
      <div id="rail-cat" role="button" tabindex="0" aria-label="みけをなでる"></div>
      <button class="chip plain sync-chip" id="sync-rail" type="button"></button>
    </div>
  </aside>
  <main class="main" id="main">
    <header class="topbar">
      <div class="logo"><b>N1</b>クイズ</div>
      <button class="chip plain sync-chip" id="sync-top" type="button"></button>
    </header>
    <div class="screen" id="screen"><p class="center muted">よみこみ中…</p></div>
  </main>
  <aside class="side" id="side" aria-label="ウィジェット"><div class="widgets" id="widgets"></div></aside>
  <footer class="player" id="player" aria-label="音楽プレーヤー"></footer>
</div>
<nav class="tabs" id="nav-tabs" aria-label="メニュー"></nav>
<dialog id="tracks" aria-label="曲リスト"></dialog>
<noscript><p class="center">このアプリは JavaScript が必要です。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
